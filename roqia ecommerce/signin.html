<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Noon | Sign In</title>

    <link rel="stylesheet" href="noon.css">
</head>

<body>

    <div class="signin-page">

        <div class="signin-image">

            <div class="image-content">

                <div class="logo">noon</div>

                <h1>
                    Welcome
                    <br>
                    Back!
                </h1>

                <p>
                    Sign in to continue shopping
                    and discover amazing products.
                </p>

            </div>

        </div>


        <div class="signin-box">

            <a href="index.html" class="back">
                ← Back to Home
            </a>


            <div class="form-container">

                <span class="small-title">
                    WELCOME BACK
                </span>

                <h2>Sign In</h2>

                <p class="subtitle">
                    Enter your account details below.
                </p>


                <form id="signinForm">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >


                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >


                    <div
                        class="error"
                        id="error"
                    ></div>


                    <button
                        type="submit"
                        class="signin-btn"
                    >
                        Sign In
                    </button>

                </form>


                <p class="signup-text">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="noon.js"></script>

</body>

</html>
