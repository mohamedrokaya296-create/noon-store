<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Noon | Cart</title>

    <link rel="stylesheet" href="noon.css">
</head>

<body>

    <header>

        <div class="logo">noon</div>

        <a href="index.html" class="back">
            ← Continue Shopping
        </a>

        <h1>My Cart 🛒</h1>

    </header>


    <main>

        <div class="page-title">

            <div>
                <span>YOUR SHOPPING BAG</span>
                <h2>Shopping Cart</h2>
            </div>

            <a href="wishlist.html">
                ❤️ Wishlist
            </a>

        </div>


        <div class="cart-layout">

            <!-- PRODUCTS -->

            <div
                class="cart-products"
                id="cartProducts"
            ></div>


            <!-- SUMMARY -->

            <div class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="subtotal">$0</strong>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <strong id="shipping">$0</strong>
                </div>

                <hr>

                <div class="total-row">
                    <span>Total</span>
                    <strong id="total">$0</strong>
                </div>

                <button
                    class="checkout"
                    onclick="checkout()"
                >
                    Proceed to Checkout
                </button>

            </div>

        </div>

    </main>


    <script src="noon.js"></script>

</body>

</html>
